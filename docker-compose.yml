version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16   # includes pgvector for AI embeddings
    container_name: qalam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qalam}
      POSTGRES_USER: ${POSTGRES_USER:-qalam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qalam_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/SCHEMA.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qalam_user} -d ${POSTGRES_DB:-qalam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API (Node.js + Express) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qalam_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qalam_user}:${POSTGRES_PASSWORD:-qalam_secret}@postgres:5432/${POSTGRES_DB:-qalam}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@qalam.io}
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  # ─── AI Chatbot Service (Python + FastAPI) ─────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: qalam_ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qalam_user}:${POSTGRES_PASSWORD:-qalam_secret}@postgres:5432/${POSTGRES_DB:-qalam}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-all-MiniLM-L6-v2}
    ports:
      - "8000:8000"
    volumes:
      - ai_models:/app/models_cache

  # ─── Frontend (React + Nginx) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_AI_URL: ${VITE_AI_URL:-http://localhost:8000}
    container_name: qalam_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    ports:
      - "3000:80"

volumes:
  postgres_data:
  ai_models:
